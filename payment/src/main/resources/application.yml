server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:mysql://localhost:3307/payment_db?useSSL=false&allowPublicKeyRetrieval=true
    username: shop
    password: shop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:keys/public_key.pem

app:
  outbox:
    poll-interval-ms: 1000
  payment:
    # fake (default): offline-runnable, deterministic, no external
    # credentials needed -- this is what every test and a fresh clone use.
    # paypal: real PayPal sandbox integration -- requires the paypal.* block
    # below to be filled in with real sandbox values. See the README section
    # on PayPal sandbox setup before switching this.
    provider: ${PAYMENT_PROVIDER:fake}

# Only read when app.payment.provider=paypal. Every value defaults to blank
# so the app still starts cleanly with the fake provider active.
paypal:
  base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  webhook-id: ${PAYPAL_WEBHOOK_ID:}
  test-card:
    number: ${PAYPAL_TEST_CARD_NUMBER:}
    expiry: ${PAYPAL_TEST_CARD_EXPIRY:}
    cvv: ${PAYPAL_TEST_CARD_CVV:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.shopstream: INFO
